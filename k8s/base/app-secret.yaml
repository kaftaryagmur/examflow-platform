apiVersion: v1
kind: Secret
metadata:
  name: examflow-secret
  namespace: examflow
type: Opaque
stringData:
  APP_ENV: "staging"
  JWT_SECRET: "examflow-dev-jwt-secret-change-me"
  MONGODB_USERNAME: "examflow"
  MONGODB_PASSWORD: "examflow-dev-password"
  # Real key is injected out-of-band (Jenkins credential / Secret Manager).
  # Left empty here so it is never committed; empty disables AI generation gracefully.
  ANTHROPIC_API_KEY: ""
