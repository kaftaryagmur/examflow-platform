grafana:
  enabled: true
  adminUser: admin
  defaultDashboardsTimezone: Europe/Istanbul

  service:
    type: ClusterIP

  persistence:
    enabled: false

prometheus:
  enabled: true

  prometheusSpec:
    retention: 7d
    scrapeInterval: 30s

    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false

    serviceMonitorNamespaceSelector: {}
    podMonitorNamespaceSelector: {}
    ruleNamespaceSelector: {}

alertmanager:
  enabled: true

# GKE Autopilot, kube-system namespace'ine yazmayı engeller (GKE Warden
# managed-namespaces-limitation). Bu yüzden operator kubelet Service/Endpoints'ini
# kube-system'de oluşturamaz ve kubelet target'ı hiç doğmaz; sonuç olarak
# pod/container (Compute Resources) panelleri boş kalır. Çözüm: kubelet'i
# observability namespace'inde topla. kubelet.namespace (ServiceMonitor'ın baktığı
# yer) ile prometheusOperator.kubeletService.namespace (operator'ın yazdığı yer)
# AYNI olmalı; aksi halde eşleşme olmaz.
kubelet:
  namespace: observability

coreDns:
  enabled: false

kubeDns:
  enabled: false

kubeEtcd:
  enabled: false

kubeControllerManager:
  enabled: false

kubeScheduler:
  enabled: false

kubeProxy:
  enabled: false

nodeExporter:
  enabled: false

prometheus-node-exporter:
  enabled: false

# kubelet.namespace ile eşleşmeli (üstteki nota bakın): operator kubelet
# Service'ini observability'ye yazsın, kube-system'e değil.
prometheusOperator:
  kubeletService:
    namespace: observability
